name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to release, e.g. v0.1.0'
        required: true
        type: string
      publish_npm:
        description: 'Publish package to npm (public)'
        required: true
        default: false
        type: boolean
      create_github_release:
        description: 'Create a GitHub Release for the tag'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # Mirrors the official npm Trusted Publishing example: registry-url
      # without any token, package cache off, npm >= 11.5.1 for OIDC.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

      # TEMPORARY debug: dump the OIDC claims npm will compare against the
      # package's registered trusted publisher.
      - name: OIDC claims (debug)
        if: inputs.publish_npm == true
        run: >
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npmjs.com" |
          python3 -c "import sys,json,base64; t=json.load(sys.stdin)['value']; p=t.split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print({k:v for k,v in c.items() if any(s in k for s in ('repositor','workflow','ref','environment','actor'))})"

      # Publishes with no token: npm authenticates this job via GitHub Actions
      # OIDC (workflow-level id-token: write), matched against the package's
      # registered trusted publisher (repo hcsolakoglu/codex-reset, workflow
      # release.yml, environment release).
      - name: Publish to npm
        if: inputs.publish_npm == true
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        if: inputs.create_github_release == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
